# Whole stack on any OS:  docker compose up --build
#   coordinator  http://localhost:8000/docs   (negotiation log: ws://localhost:8000/ws/log)
#   agents       http://localhost:8100/docs   (personal agents, challenge designer, photo checks)
#   web app      http://localhost:5173  (log in, find a group, then the game page opens)
#   spacetimedb  http://localhost:3000
services:
  spacetime:
    build:
      context: .
      dockerfile: docker/spacetime.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - shared:/shared
    healthcheck:
      test: ["CMD", "test", "-s", "/shared/spacetime_token"]
      interval: 2s
      retries: 90

  coordinator:
    build: ./coordinator
    ports:
      - "8000:8000"
    environment:
      SPACETIME_URL: http://spacetime:3000
      SPACETIME_DB: threekey
      COORDINATOR_DB: /data/coordinator.db
      # Passed through only if set on your machine; without it matching uses the rule score.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The agents service designs each round; if it's down, the coordinator uses its built-in demo round.
      CHALLENGE_DESIGNER_URL: ${CHALLENGE_DESIGNER_URL:-http://agents:8100/challenge}
      # 3 in the real design; GROUP_SIZE=2 docker compose up lets two browser windows play a whole round.
      GROUP_SIZE: ${GROUP_SIZE:-3}
      # Re-read on every call: a restarted spacetime publishes with a new token.
      SPACETIME_TOKEN_FILE: /shared/spacetime_token
    volumes:
      - shared:/shared:ro
      - coordinator-data:/data
    depends_on:
      spacetime:
        condition: service_healthy

  agents:
    build: ./agents
    ports:
      - "8100:8100"
    environment:
      COORDINATOR_URL: http://coordinator:8000
      # Persona callbacks go here; the coordinator reaches it over the Compose network.
      AGENTS_PUBLIC_URL: http://agents:8100
      # Without it, agents decide with rules and rounds use hand-written words.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: Apify scrapes place info for challenges; Moss finds relevant memories.
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID:-}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY:-}
      MOSS_INDEX: ${MOSS_INDEX:-agent-memory}
      AGENTS_DB: /data/agents.db
      AGENTS_CACHE: /data/cache
      # People, chats and photos are also saved in SpacetimeDB (agent_store), like on Heroku.
      SPACETIME_URL: http://spacetime:3000
      SPACETIME_DB: threekey
      SPACETIME_TOKEN_FILE: /shared/spacetime_token
      # Sign in with SpacetimeAuth (optional): the client id/secret from the database's SpacetimeAuth dashboard.
      SPACETIMEAUTH_CLIENT_ID: ${SPACETIMEAUTH_CLIENT_ID:-}
      SPACETIMEAUTH_CLIENT_SECRET: ${SPACETIMEAUTH_CLIENT_SECRET:-}
    volumes:
      - agents-data:/data
      - shared:/shared:ro
    depends_on:
      - coordinator

  game:
    build: ./game
    ports:
      - "5173:5173"
    environment:
      # The page reaches the coordinator at /api and SpacetimeDB at /stdb on its own address (Vite proxies them),
      # so phones and tunnels need no extra ports. Set these only to point the page somewhere else.
      VITE_SPACETIMEDB_HOST: ${SPACETIME_PUBLIC_WS:-}
      VITE_SPACETIMEDB_DB_NAME: threekey
      VITE_COORDINATOR_URL: ${COORDINATOR_PUBLIC_URL:-}
      COORDINATOR_PROXY: http://coordinator:8000
      AGENTS_PROXY: http://agents:8100
      SPACETIME_PROXY: http://spacetime:3000
    depends_on:
      spacetime:
        condition: service_healthy

  # Public https link for phones on any network: docker compose --profile tunnel up -d, then
  # docker compose logs tunnel | grep trycloudflare. Anyone with the link can use the app; stop it when done.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --url http://game:5173
    depends_on:
      - game
    profiles: ["tunnel"]

volumes:
  shared:
  coordinator-data:
  agents-data:
