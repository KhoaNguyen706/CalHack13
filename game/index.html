<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Krew</title>
    <script>
      // The cross-fade between screens is a nicety: one the browser skips (hidden tab, quick double tap) is fine.
      for (const type of ['pageswap', 'pagereveal'])
        addEventListener(type, e => {
          const t = e.viewTransition;
          if (t) for (const done of [t.ready, t.finished, t.updateCallbackDone]) done.catch(() => {});
        });
    </script>
    <style>
      /* Opting in here, not in index.css, means both pages agree before first paint, so the cross-fade isn't skipped. */
      @view-transition { navigation: auto; }
      html { background: #0e1316; }
      @media (prefers-color-scheme: light) { html { background: #f7f3ea; } }
    </style>
    <meta name="description" content="Your AI agent finds a small group nearby for a quick challenge you can only win together." />
    <!-- Add to Home Screen: Android reads the manifest, iPhone reads the apple-* tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e1316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Krew" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
